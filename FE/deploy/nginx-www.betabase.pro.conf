# Frontend nginx example for www.betabase.pro (Ubuntu VPS)
#
# Install:
#   sudo cp FE/deploy/nginx-www.betabase.pro.conf /etc/nginx/sites-available/betabase-fe
#   sudo ln -sf /etc/nginx/sites-available/betabase-fe /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Easier: after deploy, run:
#   sudo bash FE/deploy/fix-nginx-help.sh

server {
    listen 80;
    listen [::]:80;
    server_name betabase.pro www.betabase.pro;

    root /var/www/betabase/FE/build;
    index index.html;

    # Static help centre (must be before SPA fallback)
    location ^~ /help/ {
        alias /var/www/betabase/FE/build/help/;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # React SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json|xml|txt|html)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }
}

# After certbot, duplicate location ^~ /help/ inside the listen 443 ssl server block too.
